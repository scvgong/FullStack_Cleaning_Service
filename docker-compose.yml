version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-cleaning
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: cleaning_db
      MYSQL_USER: clean_user
      MYSQL_PASSWORD: cleanpass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  backend:
    build:
      context: ./backend
    container_name: cleaning-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cleaning_db
      DB_USER: clean_user
      DB_PASSWORD: cleanpass
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
    container_name: cleaning-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data:
